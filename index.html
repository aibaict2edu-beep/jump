<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ねこダッシュ！</title>
<style>
  :root { --bg:#fdf6e9; --ink:#4a3b2a; --accent:#ff8a3d; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 12px;
  }
  header {
    width: 100%; max-width: 900px; display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; justify-content: space-between; margin-bottom: 10px;
  }
  h1 { font-size: 22px; margin: 0; }
  .conn { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: bold; padding: 8px 16px; border-radius: 999px;
    border: 2px solid var(--accent); background: #fff; color: var(--accent); cursor: pointer;
  }
  button:hover { background: var(--accent); color: #fff; }
  #status { font-size: 14px; padding: 5px 12px; border-radius: 999px; background: #e9e4d8; }
  #status.on { background: #c9f0c0; }
  .stage { width: 100%; max-width: 900px; }
  canvas {
    width: 100%; height: auto; aspect-ratio: 800 / 320; display: block;
    border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.2); background: #bfe9ff;
    touch-action: manipulation; cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .help { width: 100%; max-width: 900px; font-size: 14px; line-height: 1.8; margin-top: 12px; }
  .help b { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>ねこダッシュ！</h1>
  <div class="conn">
    <span id="status">Arduino未接続：スペースキー／クリック・タップでジャンプ</span>
    <button id="btnConn" type="button">Arduino接続</button>
    <button id="btnTest" type="button" style="display:none">動作テスト</button>
  </div>
</header>

<div class="stage"><canvas id="game" aria-label="ねこダッシュのゲーム画面"></canvas></div>

<div class="help">
  <b>あそびかた：</b>走ってくる恐竜をジャンプでよけよう。ぶつかるとゲームオーバー。よけるほど点数が上がり、だんだん速くなります。<br>
  <b>操作：</b>Arduino接続中はタクトスイッチでジャンプ。未接続のときはスペースキー・画面のクリック／タップでジャンプします。スタートとリスタートはどちらでもできます。<br>
  <b>Arduinoとつなぐには：</b>USBで接続し、「Arduino接続」ボタンを押してポートを選んでください（Chrome／Edge）。一度許可すると、次回からは自動でつながります。
</div>

<script>
(() => {
'use strict';

/* ---------- 定数 ---------- */
const W = 800, H = 320, GROUND = 250, CAT_X = 130;
const FONT = '"Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",sans-serif';
const TAU = Math.PI * 2;
const JUMP_V = 730, GRAVITY = 2200;     // ジャンプ初速・重力（px/s, px/s^2）
const KEY_HIGH = 'nekoDash.highScore';

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
cv.width = W * 2; cv.height = H * 2; ctx.scale(2, 2);

const statusEl = document.getElementById('status');
const btnConn = document.getElementById('btnConn');
const btnTest = document.getElementById('btnTest');

const mod = (a, n) => ((a % n) + n) % n;
const circ = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); };
const ell = (x, y, rx, ry, rot = 0) => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.fill(); };
const ellS = (x, y, rx, ry, rot = 0) => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.fill(); ctx.stroke(); };
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/* ---------- ハイスコア（ブラウザに保存） ---------- */
function loadHigh() { try { return parseInt(localStorage.getItem(KEY_HIGH), 10) || 0; } catch (e) { return 0; } }
function saveHigh(v) { try { localStorage.setItem(KEY_HIGH, String(v)); } catch (e) {} }

/* ---------- ゲーム状態 ---------- */
let state = 'ready';               // ready | playing | over
let score = 0, high = loadHigh(), newHigh = false;
let scroll = 0, t = 0, shake = 0, overAt = 0;
let cat = { y: 0, vy: 0, onGround: true, phase: 0 };   // y = 地面からの高さ
let dinos = [], spawnTimer = 0, floaters = [], banner = { text: '', life: 0 };
const clouds = [{x:80,y:50,s:1},{x:300,y:92,s:.7},{x:520,y:38,s:1.2},{x:720,y:100,s:.8},{x:930,y:60,s:1}];

const level = () => Math.floor(score / 5) + 1;
function playSpeed() {                         // 点数が上がるほど速く（上限は約1050px/s）
  const base = 300 + Math.min(score, 22) * 22;  // 22点で約784px/s
  const extra = Math.max(0, score - 22) * 8;    // それ以降もゆっくり加速
  return Math.min(1050, base + extra);
}

function resetGame() {
  score = 0; newHigh = false; shake = 0;
  cat = { y: 0, vy: 0, onGround: true, phase: 0 };
  dinos = []; floaters = []; spawnTimer = 1.4; banner = { text: '', life: 0 };
}

function startGame() { resetGame(); state = 'playing'; }

function jump() {
  if (state !== 'playing' || !cat.onGround) return;
  cat.vy = JUMP_V; cat.onGround = false;
  send('L');                                   // LED点滅
}

function gameOver() {
  state = 'over'; overAt = performance.now(); shake = 0.4;
  if (score > high) { high = score; newHigh = true; saveHigh(high); }
  send('G');                                   // ゲームオーバー音＋LED
}

function spawnDino() {
  const x0 = W + 70;
  let count = 1, spacing = 95, size = 1;
  const r = Math.random();
  const pairP = score >= 6 ? Math.min(0.35, 0.1 + (score - 6) * 0.02) : 0;     // 2匹連続
  const tripleP = score >= 20 ? Math.min(0.2, (score - 18) * 0.01) : 0;        // 3匹連続
  if (r < tripleP) { count = 3; spacing = 90; }
  else if (r < tripleP + pairP) { count = 2; spacing = 95; }
  else {
    const q = Math.random();
    if (score >= 8 && q < Math.min(0.3, (score - 6) * 0.02)) size = 1.25;      // 大きい恐竜
    else if (q > 0.8) size = 0.8;                                              // 小さい恐竜
  }
  for (let i = 0; i < count; i++)
    dinos.push({ x: x0 + i * spacing, s: size, phase: Math.random() * 6, passed: false });
  spawnTimer += ((count - 1) * spacing) / playSpeed();
}

// 次の恐竜が出るまでの時間（秒）：すぐ次が来る／ふつう／ひと息つける、をランダムに混ぜる
function nextGap() {
  const k = Math.max(0, 1 - score / 40);          // 序盤1 → 40点で0
  const quickP = Math.min(0.4, score * 0.03);     // 「すぐ次が来る」確率は点数とともに増える
  const r = Math.random();
  if (r < quickP) return 0.82 + 0.3 * k * Math.random();
  if (r < quickP + 0.25) return 1.8 + k * (0.5 + Math.random() * 0.5);
  return 1.05 + 0.35 * k + Math.random() * (0.35 + 1.0 * k);
}

/* ---------- 入力（スイッチ／キーボード／タップ） ---------- */
function onInput(source) {                     // source: 'switch' | 'other'
  if (state === 'playing') {
    if ((source === 'switch' && connected) || (source === 'other' && !connected)) jump();
  } else if (state === 'ready') {
    startGame();
  } else if (state === 'over') {
    if (performance.now() - overAt > 700) startGame();
  }
}
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (!e.repeat) onInput('other');
  }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') e.preventDefault(); });
cv.addEventListener('pointerdown', e => { e.preventDefault(); onInput('other'); });

/* ---------- 更新 ---------- */
function update(dt) {
  t += dt;
  if (shake > 0) shake -= dt;
  const sp = state === 'playing' ? playSpeed() : (state === 'ready' ? 200 : 0);
  scroll += sp * dt;

  if (state === 'ready') cat.phase += dt * 12;

  if (state === 'playing') {
    if (!cat.onGround) {
      cat.vy -= GRAVITY * dt; cat.y += cat.vy * dt;
      if (cat.y <= 0) { cat.y = 0; cat.vy = 0; cat.onGround = true; }
    } else cat.phase += dt * 14;

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnDino();
      spawnTimer += nextGap();
    }

    const cb = { l: CAT_X - 16, r: CAT_X + 16, t: GROUND - cat.y - 50, b: GROUND - cat.y - 3 };
    for (const d of dinos) {
      d.x -= sp * dt; d.phase += dt * 12;
      const hw = 26 * d.s, hh = 52 * d.s;
      const db = { l: d.x - hw, r: d.x + hw, t: GROUND - hh, b: GROUND - 2 };
      if (cb.r > db.l && cb.l < db.r && cb.b > db.t && cb.t < db.b) { gameOver(); break; }
      if (!d.passed && d.x + hw < CAT_X - 16) {          // よけ成功
        d.passed = true;
        const lv = level(); score++;
        if (level() !== lv) banner = { text: `スピードアップ！ Lv ${level()}`, life: 1.3 };
        send('S');                                       // 成功音
        floaters.push({ x: CAT_X + 8, y: GROUND - cat.y - 74, life: 0.8 });
      }
    }
    dinos = dinos.filter(d => d.x > -90);
  }
  for (const f of floaters) { f.life -= dt; f.y -= 40 * dt; }
  if (banner.life > 0) banner.life -= dt;
  floaters = floaters.filter(f => f.life > 0);
}

/* ---------- 描画：背景 ---------- */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#8fd3ff'); g.addColorStop(1, '#fff3d6');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const sg = ctx.createRadialGradient(690, 70, 10, 690, 70, 70);
  sg.addColorStop(0, 'rgba(255,240,150,1)'); sg.addColorStop(1, 'rgba(255,240,150,0)');
  ctx.fillStyle = sg; circ(690, 70, 70);
  ctx.fillStyle = '#ffe27a'; circ(690, 70, 32);

  for (const c of clouds) {
    const x = mod(c.x - scroll * 0.1 * c.s, 1100) - 150, y = c.y, s = c.s;
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    circ(x, y, 18 * s); circ(x + 22 * s, y - 10 * s, 22 * s); circ(x + 46 * s, y, 18 * s);
    ctx.fillRect(x, y - 2 * s, 46 * s, 18 * s);
  }

  // 遠い丘・近い丘（速度差で奥行き）
  const hill = (base, amp, k1, k2, spd, ph, color) => {
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, GROUND);
    for (let x = 0; x <= W; x += 8) {
      const o = x + scroll * spd;
      ctx.lineTo(x, base + amp * Math.sin(o / k1 + ph) + amp * 0.45 * Math.sin(o / k2));
    }
    ctx.lineTo(W, GROUND); ctx.closePath(); ctx.fill();
  };
  hill(205, 22, 110, 43, 0.2, 0, '#b4e8ac');
  hill(228, 15, 70, 29, 0.4, 1.3, '#86d67f');

  // 草むら・花・木（ひとつ手前の流れ）
  const base = scroll * 0.7, n = Math.floor(base / 340);
  for (let k = 0; k < 4; k++) {
    const id = n + k, bx = id * 340 - base + 60 + (id * 37) % 80;
    const type = id % 3;
    if (type === 0) {
      ctx.fillStyle = '#4fb85a'; circ(bx, GROUND - 8, 14); circ(bx + 16, GROUND - 14, 18); circ(bx + 34, GROUND - 8, 14);
    } else if (type === 1) {
      for (let i = 0; i < 4; i++) {
        const fx = bx + i * 14, fy = GROUND - 14 - (i % 2) * 8;
        ctx.strokeStyle = '#3fa43a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(fx, GROUND); ctx.lineTo(fx, fy); ctx.stroke();
        ctx.fillStyle = ['#ff7aa2', '#ffd447', '#ffffff', '#ff9a52'][i]; circ(fx, fy, 5);
        ctx.fillStyle = '#ffb300'; circ(fx, fy, 2);
      }
    } else {
      ctx.fillStyle = '#9a6a3a'; ctx.fillRect(bx + 8, GROUND - 36, 8, 36);
      ctx.fillStyle = '#4fb85a'; circ(bx + 12, GROUND - 46, 22); circ(bx + 0, GROUND - 38, 14); circ(bx + 24, GROUND - 38, 14);
    }
  }

  // 地面
  ctx.fillStyle = '#e0a96d'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#5cc24f'; ctx.fillRect(0, GROUND, W, 12);
  ctx.fillStyle = '#4aae40'; ctx.fillRect(0, GROUND + 10, W, 3);
  ctx.fillStyle = '#3fa43a';
  for (let i = 0; i < 16; i++) {
    const x = mod(i * 57 - scroll, W + 30) - 15;
    ctx.beginPath(); ctx.moveTo(x - 4, GROUND); ctx.lineTo(x, GROUND - 7); ctx.lineTo(x + 4, GROUND); ctx.fill();
  }
  ctx.fillStyle = '#c98f55';
  for (let i = 0; i < 14; i++) {
    const x = mod(i * 83 - scroll, W + 40) - 20, y = GROUND + 26 + (i % 3) * 16;
    ell(x, y, 8 + (i % 3) * 2, 3);
  }
}

/* ---------- 描画：ねこ ---------- */
function drawCat() {
  const air = !cat.onGround, over = state === 'over';
  ctx.save();
  ctx.translate(CAT_X, GROUND - cat.y);

  const sh = 1 - Math.min(cat.y, 130) / 220;                       // 影
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ell(0, cat.y + 2, 24 * sh, 5 * sh);

  const bob = air ? 0 : Math.abs(Math.sin(cat.phase)) * 2.5;
  ctx.translate(0, -bob);
  const ORG = '#ffb34d', ORG_D = '#e0892b', CREAM = '#fff0d2';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // しっぽ
  const tw = air ? -12 : Math.sin(cat.phase * 0.5) * 6;
  ctx.strokeStyle = ORG_D; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(-20, -20); ctx.quadraticCurveTo(-44, -24 + tw, -38, -50 + tw); ctx.stroke();
  ctx.strokeStyle = ORG; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(-20, -20); ctx.quadraticCurveTo(-44, -24 + tw, -38, -50 + tw); ctx.stroke();

  // 耳
  ctx.fillStyle = ORG; ctx.strokeStyle = ORG_D; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-25, -40); ctx.lineTo(-17, -68); ctx.lineTo(-3, -50); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5, -50); ctx.lineTo(19, -68); ctx.lineTo(26, -40); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffb0c0';
  ctx.beginPath(); ctx.moveTo(-20, -48); ctx.lineTo(-16, -60); ctx.lineTo(-9, -51); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10, -51); ctx.lineTo(18, -60); ctx.lineTo(21, -47); ctx.closePath(); ctx.fill();

  // からだ（あたま一体）
  ctx.fillStyle = ORG; ctx.strokeStyle = ORG_D; ctx.lineWidth = 2.5;
  ellS(0, -28, 27, 24);
  ctx.fillStyle = CAT_BELLY(); ell(3, -17, 15, 11);

  // おでこの模様
  ctx.strokeStyle = ORG_D; ctx.lineWidth = 3;
  for (const sx of [-5, 2, 9]) { ctx.beginPath(); ctx.moveTo(sx, -51); ctx.lineTo(sx, -45); ctx.stroke(); }

  // 足
  ctx.fillStyle = CREAM; ctx.strokeStyle = ORG_D; ctx.lineWidth = 2;
  if (air) {
    ellS(-12, -7, 8, 5); ellS(19, -9, 8, 5);
  } else {
    const p = cat.phase;
    ellS(-9 + Math.sin(p) * 9, -5 - Math.max(0, Math.cos(p)) * 6, 8, 5);
    ellS(11 + Math.sin(p + Math.PI) * 9, -5 - Math.max(0, Math.cos(p + Math.PI)) * 6, 8, 5);
  }

  // かお
  if (over) {
    ctx.strokeStyle = '#2b1d12'; ctx.lineWidth = 2.5;
    for (const ex of [4, 19]) {
      ctx.beginPath(); ctx.moveTo(ex - 4, -38); ctx.lineTo(ex + 4, -29); ctx.moveTo(ex + 4, -38); ctx.lineTo(ex - 4, -29); ctx.stroke();
    }
  } else if (mod(t, 3.2) < 0.12) {
    ctx.strokeStyle = '#2b1d12'; ctx.lineWidth = 2.5;
    for (const ex of [4, 19]) { ctx.beginPath(); ctx.moveTo(ex - 4, -33); ctx.lineTo(ex + 4, -33); ctx.stroke(); }
  } else {
    ctx.fillStyle = '#2b1d12'; ell(4, -33, 4.2, 5.6); ell(19, -33, 4.2, 5.6);
    ctx.fillStyle = '#fff'; circ(5.6, -35, 1.7); circ(20.6, -35, 1.7);
  }
  ctx.fillStyle = 'rgba(255,110,140,.55)'; circ(-3, -23, 5); circ(25, -23, 5);
  ctx.fillStyle = '#ff7a93'; ell(11.5, -27, 2.8, 2);
  ctx.strokeStyle = '#7a4a2a'; ctx.lineWidth = 1.8;
  if (air && !over) {
    ctx.fillStyle = '#b5483f'; ell(11.5, -20, 3.2, 3.8);
  } else if (!over) {
    ctx.beginPath(); ctx.arc(8, -25, 3.5, 0.1, Math.PI - 0.1); ctx.stroke();
    ctx.beginPath(); ctx.arc(15, -25, 3.5, 0.1, Math.PI - 0.1); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(11.5, -18, 4, Math.PI + 0.3, TAU - 0.3); ctx.stroke();
  }
  ctx.lineWidth = 1.4;
  for (const [x1, y1, x2, y2] of [[26,-28,38,-31],[26,-24,38,-23],[-4,-28,-15,-31],[-4,-24,-15,-23]]) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  ctx.restore();
}
function CAT_BELLY() { return '#fff0d2'; }

/* ---------- 描画：恐竜 ---------- */
function drawDino(d) {
  ctx.save();
  ctx.translate(d.x, GROUND);
  ctx.scale(d.s, d.s);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ell(0, 2, 36, 5);

  const p = d.phase, bob = Math.abs(Math.sin(p)) * 2;
  ctx.translate(0, -bob);
  const G = '#5bc96c', GD = '#34964a', BELLY = '#dcf7ae', ORG = '#ff9f43';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 2.5; ctx.strokeStyle = GD;

  // 足
  ctx.fillStyle = G;
  ellS(-2 + Math.sin(p) * 6, -7 - Math.max(0, Math.cos(p)) * 7, 10, 7);
  ellS(18 + Math.sin(p + Math.PI) * 6, -7 - Math.max(0, Math.cos(p + Math.PI)) * 7, 10, 7);

  // しっぽ
  ctx.beginPath(); ctx.moveTo(22, -38); ctx.quadraticCurveTo(46, -38, 56, -16 + Math.sin(p) * 3);
  ctx.quadraticCurveTo(38, -20, 24, -16); ctx.closePath(); ctx.fill(); ctx.stroke();

  // 背中のトゲ
  ctx.fillStyle = ORG; ctx.strokeStyle = '#d97a1a'; ctx.lineWidth = 2;
  for (const sx of [-2, 10, 22]) {
    ctx.beginPath(); ctx.moveTo(sx - 6, -44); ctx.lineTo(sx, -58); ctx.lineTo(sx + 6, -44); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.strokeStyle = GD; ctx.lineWidth = 2.5;

  // からだ・おなか
  ctx.fillStyle = G; ellS(6, -28, 28, 20);
  ctx.fillStyle = BELLY; ell(0, -22, 17, 12);

  // うで
  ctx.fillStyle = G; ellS(-13, -25, 6, 3.5, 0.5);

  // あたま（口先→頭の順に重ねる）
  ctx.fillStyle = G; ellS(-37, -44, 13, 10);
  ellS(-22, -48, 22, 18);
  ctx.fillStyle = G; ell(-30, -44, 12, 9);        // 継ぎ目を隠す
  ctx.fillStyle = GD; circ(-46, -48, 1.6);         // 鼻
  // 頭のトゲ
  ctx.fillStyle = ORG; ctx.strokeStyle = '#d97a1a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-8, -60); ctx.lineTo(-4, -70); ctx.lineTo(0, -58); ctx.closePath(); ctx.fill(); ctx.stroke();

  // かお
  ctx.fillStyle = '#fff'; ctx.strokeStyle = GD; ctx.lineWidth = 2; ellS(-22, -53, 6, 6.5);
  ctx.fillStyle = '#1d2b20'; circ(-24, -53, 3.2);
  ctx.fillStyle = '#fff'; circ(-25, -54.5, 1.1);
  ctx.strokeStyle = '#25693a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-30, -62); ctx.lineTo(-16, -58); ctx.stroke();      // きりっとした眉
  ctx.fillStyle = 'rgba(255,110,130,.5)'; circ(-27, -42, 4.5);
  ctx.strokeStyle = '#25693a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-47, -40); ctx.quadraticCurveTo(-38, -35, -28, -39); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(-43, -39); ctx.lineTo(-40, -34); ctx.lineTo(-37, -38); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- 描画：HUD・パネル ---------- */
function text(str, x, y, size, color, align = 'center', stroke = '#fff') {
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = 5; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function drawHUD() {
  text(`スコア ${score}`, 16, 24, 22, '#4a3b2a', 'left');
  text(`Lv ${level()}`, W / 2, 24, 22, '#ff8a3d', 'center');
  text(`ハイスコア ${high}`, W - 16, 24, 22, '#4a3b2a', 'right');
}
function prompt() {
  return connected ? 'タクトスイッチを押して' : 'スペースキー／画面タップで';
}
function panel(h) {
  ctx.fillStyle = 'rgba(255,255,255,.88)'; rr(W / 2 - 230, 62, 460, h, 22); ctx.fill();
  ctx.strokeStyle = '#ffb34d'; ctx.lineWidth = 4; ctx.stroke();
}
function drawOverlay() {
  if (state === 'ready') {
    panel(168);
    text('ねこダッシュ！', W / 2, 108, 42, '#ff8a3d');
    text('恐竜をジャンプでよけよう', W / 2, 152, 22, '#4a3b2a');
    if (Math.floor(t * 2) % 2 === 0) text(prompt() + 'スタート', W / 2, 198, 22, '#2f9e44');
  } else if (state === 'over') {
    panel(newHigh ? 190 : 168);
    text('ゲームオーバー', W / 2, 104, 42, '#e0483a');
    text(`スコア ${score}　　ハイスコア ${high}`, W / 2, 148, 22, '#4a3b2a');
    let y = 186;
    if (newHigh) { text('★ ハイスコア更新！ ★', W / 2, y, 24, '#e6a100'); y += 38; } else y += 4;
    if (performance.now() - overAt > 700 && Math.floor(t * 2) % 2 === 0)
      text(prompt() + 'もう一度', W / 2, y + (newHigh ? 0 : 10), 22, '#2f9e44');
  }
}

function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8);
  drawBackground();
  dinos.forEach(drawDino);
  drawCat();
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, f.life / 0.8);
    text('+1', f.x, f.y, 26, '#ff8a3d');
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  drawHUD();
  if (banner.life > 0 && state === 'playing') {
    ctx.globalAlpha = Math.min(1, banner.life / 0.4);
    text(banner.text, W / 2, 66, 30, '#e0483a');
    ctx.globalAlpha = 1;
  }
  drawOverlay();
}

/* ---------- メインループ ---------- */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* =====================================================
   Arduino 連携（Web Serial API）
   Arduino → PC : 'J'  タクトスイッチが押された
   PC → Arduino : 'L'  ジャンプ時のLED点滅
                  'S'  よけ成功の効果音
                  'G'  ゲームオーバーの効果音とLED
   ===================================================== */
let port = null, reader = null, writer = null, connected = false;
const hasSerial = 'serial' in navigator;

function updateStatus(msg) {
  statusEl.textContent = msg || (connected
    ? 'Arduino接続中：タクトスイッチでジャンプ'
    : 'Arduino未接続：スペースキー／クリック・タップでジャンプ');
  statusEl.classList.toggle('on', connected);
  btnConn.textContent = connected ? 'Arduino切断' : 'Arduino接続';
  btnTest.style.display = connected ? '' : 'none';
}

function send(ch) {
  if (!connected || !writer) return;
  writer.write(new Uint8Array([ch.charCodeAt(0)])).catch(() => {});
}

async function openPort(p) {
  await p.open({ baudRate: 115200 });
  port = p; connected = true;
  writer = p.writable.getWriter();
  updateStatus();
  readLoop(p);
}

async function readLoop(p) {
  const rd = p.readable.getReader();
  reader = rd;
  try {
    while (true) {
      const { value, done } = await rd.read();
      if (done) break;
      for (const b of value) if (b === 74) onInput('switch');   // 'J'
    }
  } catch (e) { /* 抜けた・切断された */ }
  finally {
    try { rd.releaseLock(); } catch (e) {}
    handleDisconnect(p);
  }
}

async function handleDisconnect(p) {
  if (port !== p) return;
  connected = false;
  try { if (writer) writer.releaseLock(); } catch (e) {}
  writer = null; reader = null;
  try { await p.close(); } catch (e) {}
  port = null;
  updateStatus();
}

async function closePort() {
  if (reader) { try { await reader.cancel(); } catch (e) {} }
}

btnConn.addEventListener('click', async () => {
  btnConn.blur();
  if (!hasSerial) return;
  if (connected) { await closePort(); return; }
  try {
    const p = await navigator.serial.requestPort();
    await openPort(p);
  } catch (e) {
    if (e && e.name === 'NotFoundError') return;   // 選択をキャンセル
    updateStatus('接続できませんでした。Arduino IDEのシリアルモニタなどを閉じて、もう一度お試しください。');
  }
});

btnTest.addEventListener('click', () => {          // LED・ブザーの動作確認
  btnTest.blur();
  send('L'); setTimeout(() => send('S'), 700); setTimeout(() => send('G'), 1500);
});

if (!hasSerial) {
  btnConn.style.display = 'none';
  updateStatus('このブラウザではArduino接続は使えません（Chrome／Edgeで開いてください）。スペースキー／タップで遊べます。');
} else {
  // 前に許可したポートがあれば自動接続
  navigator.serial.getPorts().then(ports => {
    if (ports.length) openPort(ports[0]).catch(() => {});
  }).catch(() => {});
  navigator.serial.addEventListener('connect', e => {
    if (!connected) openPort(e.target).catch(() => {});
  });
}

// __DEBUG_HOOK__
})();
</script>
</body>
